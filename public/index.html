<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex — Buscador de Pokémon</title>
  <meta name="description" content="Pokédex interactiva que busca Pokémon en MySQL y MongoDB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app-container" class="series-hub theme-pokemon">
    <header class="hub-header">
      <h1 id="title">ANIME SERIES</h1>
      <div class="series-selector">
        <button class="series-btn btn-pokemon" onclick="switchSeries('pokemon')">
          <span class="btn-icon">⚡</span> Pokémon
        </button>
        <button class="series-btn btn-naruto" onclick="switchSeries('naruto')">
          <span class="btn-icon">🍥</span> Naruto
        </button>
        <button class="series-btn btn-dragonball" onclick="switchSeries('dragonball')">
          <span class="btn-icon">🐉</span> Dragon Ball
        </button>
      </div>
    </header>

    <main class="hub-main">
      <div class="search-container">
        <input
          type="text"
          id="search"
          placeholder="Busca un personaje..."
          autocomplete="off"
        />
        <div id="status" class="status-text"></div>
      </div>

      <div id="character-display" class="character-display">
        <!-- Contenido dinámico aquí -->
        <div class="empty-state">
          <p>Selecciona una serie y busca tu personaje favorito</p>
        </div>
      </div>
    </main>

    <footer class="hub-footer">
      <div class="swagger-links">
        <a href="http://localhost:3000/api-docs" target="_blank" class="swag-link">Poki Doc(JS)</a>
        <a href="http://localhost:8081/swagger-ui.html" target="_blank" class="swag-link">Naruto Doc(Java)</a>
        <a href="http://localhost:8000/docs" target="_blank" class="swag-link">DBall Doc(Py)</a>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
