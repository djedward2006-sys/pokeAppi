<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex — Buscador de Pokémon</title>
  <meta name="description" content="Pokédex interactiva que busca Pokémon en MySQL y MongoDB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="pokedex">
    <!-- Parte superior: lente + LEDs -->
    <div class="pokedex-top">
      <div class="camera-lens">
        <div class="camera-inner"></div>
        <div class="camera-shine"></div>
      </div>
      <div class="led-row">
        <div class="led led-red"><div class="led-shine"></div></div>
        <div class="led led-yellow"><div class="led-shine"></div></div>
        <div class="led led-green"><div class="led-shine"></div></div>
      </div>
    </div>

    <!-- Pantalla principal -->
    <div class="screen-frame">
      <div class="screen-border">
        <div class="screen-indicators">
          <div class="screen-dot"></div>
          <div class="screen-dot"></div>
        </div>
        <div class="screen" id="screen">
          <h1 class="screen-title" id="title">POKÉDEX</h1>
          <div class="search-area">
            <input
              type="text"
              id="search"
              placeholder="Nombre del Pokémon..."
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div id="status" class="status-text"></div>
        </div>
        <div class="screen-bar"></div>
      </div>
    </div>

    <!-- Controles inferiores -->
    <div class="controls">
      <div class="dpad-area">
        <div class="dpad">
          <div class="dpad-center"></div>
        </div>
      </div>
      <div class="action-buttons">
        <button class="btn-db btn-mysql" onclick="buscar('mysql')">
          <span class="btn-icon">🐬</span>
          <span>MySQL</span>
        </button>
        <button class="btn-db btn-mongo" onclick="buscar('mongo')">
          <span class="btn-icon">🍃</span>
          <span>MongoDB</span>
        </button>
      </div>
    </div>

    <!-- Líneas decorativas del Pokédex -->
    <div class="hinge-line"></div>
    <div class="bottom-lights">
      <div class="bottom-light"></div>
      <div class="bottom-light"></div>
    </div>
  </div>

  <!-- MODAL de resultado -->
  <div id="modal" class="modal">
    <div class="modal-backdrop" onclick="cerrar()"></div>
    <div class="card">
      <button class="close-btn" onclick="cerrar()" aria-label="Cerrar">✕</button>
      <div class="card-header">
        <h2 id="name" class="pokemon-name"></h2>
      </div>
      <div class="card-images">
        <div class="img-wrapper">
          <span class="img-label">Frente</span>
          <img id="front" alt="Frente del Pokémon">
        </div>
        <div class="img-wrapper">
          <span class="img-label">Espalda</span>
          <img id="back" alt="Espalda del Pokémon">
        </div>
      </div>
      <div class="card-info" id="info"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
